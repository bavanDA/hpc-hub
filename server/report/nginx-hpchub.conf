# hpchub.staylazy.app behind Cloudflare's proxy: the wiki, and /report for the app's bug reports.
# Both ports serve the same, with no redirect, so it works whatever Cloudflare's SSL mode is.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/hpchub.staylazy.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hpchub.staylazy.app/privkey.pem;
    server_name hpchub.staylazy.app;
    server_tokens off;
    root /var/www/hpchub-wiki;
    index index.html;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /.well-known/acme-challenge/ { default_type text/plain; }
    location = /report {  # the app sends a report here
        limit_except POST { deny all; }
        limit_req zone=hpchub_report burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8098/v1/reports;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /report/ {  # reading them back takes the owner's key
        limit_req zone=hpchub_report burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8098/v1/;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { try_files $uri $uri.html $uri/ =404; }
}
