name: Build

# By hand only, so it never spends minutes by surprise (GitHub Pro: 3000 a month; macOS counts 10x, Windows 2x).
# A full build is about 110 counted minutes; pick fewer systems to spend less.
on:
  workflow_dispatch:
    inputs:
      systems:
        description: 'Runners as JSON, e.g. ["ubuntu-22.04"] for Linux only'
        default: '["ubuntu-22.04","macos-15","windows-latest"]'
      publish:
        description: 'Publish a GitHub release of this version (the app offers it as an update). Needs all systems.'
        type: boolean
        default: false
      notes:
        description: "What's new, shown in the app's update window"
        default: ''

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the oldest glibc we build on is the oldest the installers run on
        os: ${{ fromJSON(inputs.systems) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # a stuck macOS job costs at most 300 of the month's minutes
    env:
      # signs the update files (packaging/release.py puts the signatures in latest.json); the app only installs
      # updates signed with this key, whose public half is in app/src-tauri/tauri.conf.json
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # macOS: HPC Hub's own code-signing certificate (self-made, not Apple's), so every build is the same app to
      # macOS and the Keychain stops asking after one "Always Allow" (docs/releasing.md)
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
    steps:
      - name: A release needs the update key
        if: inputs.publish && env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: |
          echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY secret first (see docs/releasing.md)"
          exit 1
      - uses: actions/checkout@v7

      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev patchelf file

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-backend.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/vpn-helper

      - name: Frozen backend
        run: |
          pip install -r packaging/requirements-backend.txt
          python packaging/build_backend.py
      - name: Frozen backend answers
        timeout-minutes: 2
        shell: bash
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"app.version"}' |
            app/src-tauri/binaries/hpc-hub-backend-* | grep '"version"'
      - name: Frozen backend has the SSH bridge (the asyncssh login's local ssh commands)
        timeout-minutes: 2
        shell: bash
        run: |
          # no arguments: prints its usage and exits 2
          { app/src-tauri/binaries/hpc-hub-backend-* --ssh-bridge 2>&1 || true; } | grep usage

      # VPN on Windows and macOS (docs/design/vpn-helper.md): openconnect and the helper go into
      # app/src-tauri/vpn/, which tauri.windows.conf.json / tauri.macos.conf.json ship as <resources>/vpn/.
      # openconnect is kept in the cache until its scripts change, which saves most of these minutes.
      - name: openconnect from an earlier build
        id: openconnect
        if: runner.os != 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: app/src-tauri/vpn/openconnect
          key: openconnect-${{ runner.os }}-${{ hashFiles('packaging/fetch_openconnect_*.sh', 'packaging/vpn/*') }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && steps.openconnect.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
      - name: openconnect (Windows; MSYS2 has no package, so this builds it)
        if: runner.os == 'Windows' && steps.openconnect.outputs.cache-hit != 'true'
        timeout-minutes: 15
        shell: msys2 {0}
        run: bash packaging/fetch_openconnect_windows.sh
      - name: openconnect (macOS, Homebrew's)
        if: runner.os == 'macOS' && steps.openconnect.outputs.cache-hit != 'true'
        timeout-minutes: 8  # dylibbundler waits for an answer if it can't find a library
        run: bash packaging/fetch_openconnect_macos.sh
      - name: Keep openconnect for the next build
        if: runner.os != 'Linux' && steps.openconnect.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/src-tauri/vpn/openconnect
          key: ${{ steps.openconnect.outputs.cache-primary-key }}
      - name: VPN helper
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --release --manifest-path app/vpn-helper/Cargo.toml
          exe=""; if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          mkdir -p app/src-tauri/vpn
          cp "app/vpn-helper/target/release/hpc-hub-vpn-helper$exe" app/src-tauri/vpn/
      - name: Bundled openconnect and VPN helper start
        if: runner.os != 'Linux'
        timeout-minutes: 2
        shell: bash
        run: |
          cd app/src-tauri/vpn
          if [ "$RUNNER_OS" = Windows ]; then
            # only Windows' own folders on PATH, so a DLL left out of the bundle can't load from elsewhere
            PATH=/c/Windows/System32:/c/Windows openconnect/openconnect.exe --version
            ./hpc-hub-vpn-helper.exe --version
          else
            openconnect/openconnect --version
            ./hpc-hub-vpn-helper --version
          fi

      - run: npm ci
        working-directory: app
      - name: Sign the Mac app with HPC Hub's own certificate (when it is set)
        if: runner.os == 'macOS' && env.MACOS_SIGN_P12 != ''
        shell: bash
        run: |
          # A keychain of this run's own, in the search list (codesign looks there), with codesign allowed to use
          # the key without asking. macOS doesn't trust a self-made certificate, so it is named by its SHA-1:
          # codesign signs with it anyway, and the signature names it, which is what makes builds the same app.
          kc="$RUNNER_TEMP/hpc-hub-signing.keychain-db"; kpw=$(uuidgen)
          security create-keychain -p "$kpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kpw" "$kc"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$MACOS_SIGN_P12_PASSWORD" -A -t agg -f pkcs12
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -p codesigning "$kc" | awk '/"HPC Hub Self Signed"/ {print $2; exit}')
          test -n "$id"
          echo "APPLE_SIGNING_IDENTITY=$id" >> "$GITHUB_ENV"

      - name: Make update files too (when the key is set)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          node -e "const f='packaging/tauri.release.json', c=JSON.parse(require('fs').readFileSync(f));
            c.bundle.createUpdaterArtifacts = true; require('fs').writeFileSync(f, JSON.stringify(c, null, 2))"
      - run: npm run tauri:release
        working-directory: app
      - name: The Mac app is signed with HPC Hub's certificate
        if: runner.os == 'macOS' && env.MACOS_SIGN_P12 != ''
        shell: bash
        run: |
          app=$(ls -d app/src-tauri/target/release/bundle/macos/*.app)
          for bin in "$app/Contents/MacOS/"*; do
            req=$(codesign -dr - "$bin" 2>&1 | tail -1)
            echo "$(basename "$bin"): $req"
            echo "$req" | grep -q 'certificate root = H"'
          done

      - uses: actions/upload-artifact@v7
        with:
          name: hpc-hub-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/*/*.sig

  release:
    # A normal release, not a pre-release: the app asks releases/latest for latest.json, which skips pre-releases
    if: inputs.publish
    needs: installers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: built
      - name: Release files and latest.json
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "V=$V" >> "$GITHUB_ENV"
          printf '%s\n' "${NOTES:-HPC Hub $V}" > notes.txt
          python3 packaging/release.py built out "$V" notes.txt
          ls -la out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::error::v$V is released already. Raise the version in app/src-tauri/tauri.conf.json first"
            exit 1
          fi
          gh release create "v$V" out/* --title "HPC Hub $V" --notes-file notes.txt --target "$GITHUB_SHA" --latest
