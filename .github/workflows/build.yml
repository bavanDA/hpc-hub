name: Build

# By hand only, so it never spends minutes by surprise (GitHub Pro: 3000 a month; macOS counts 10x, Windows 2x).
# A full build is about 110 counted minutes; tick fewer systems to spend less (Linux alone: about 9).
on:
  workflow_dispatch:
    inputs:
      linux:
        description: 'Linux (AppImage, deb, rpm)'
        type: boolean
        default: true
      windows:
        description: 'Windows (exe, msi; minutes count 2x)'
        type: boolean
        default: false
      macos:
        description: 'macOS (dmg; minutes count 10x)'
        type: boolean
        default: false
      publish:
        description: 'Publish a GitHub release of this version (the app offers it as an update). Needs all three.'
        type: boolean
        default: false
      beta:
        description: 'Publish as a beta (next version, -beta.<build>): apps with Beta updates on get it. Any systems.'
        type: boolean
        default: false
      notes:
        description: "What's new, shown in the app's update window"
        default: ''

# Releases one at a time; a test build never waits behind another build
concurrency:
  group: build-${{ (inputs.publish || inputs.beta) && 'release' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the oldest glibc we build on is the oldest the installers run on
        os: ${{ fromJSON(format('["{0}","{1}","{2}"]', inputs.linux && 'ubuntu-22.04' || 'skip',
          inputs.windows && 'windows-latest' || 'skip', inputs.macos && 'macos-15' || 'skip')) }}
        exclude:
          - os: skip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # a stuck macOS job costs at most 300 of the month's minutes
    env:
      # signs the update files (packaging/release.py puts the signatures in latest.json); the app only installs
      # updates signed with this key, whose public half is in app/src-tauri/tauri.conf.json
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # macOS: HPC Hub's own code-signing certificate (self-made, not Apple's), so every build is the same app to
      # macOS and the Keychain stops asking after one "Always Allow" (docs/releasing.md)
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
    steps:
      - name: A release needs the update key
        if: inputs.publish && env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: |
          echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY secret first (see docs/releasing.md)"
          exit 1
      - name: A release or a beta, not both
        if: inputs.publish && inputs.beta
        run: |
          echo "::error::Tick publish for a release or beta for a beta, not both"
          exit 1
      - name: A release needs all three systems
        if: inputs.publish && !(inputs.linux && inputs.windows && inputs.macos)
        run: |
          echo "::error::Tick Linux, Windows and macOS to publish: the update file names all three"
          exit 1
      - uses: actions/checkout@v7
      # A beta is the next version with this build's number: 0.2.5 released, so 0.2.6-beta.<run>. Newer than the
      # release, older than 0.2.6 itself. Set here only, so every system's build of this run has the same one.
      - name: A beta's version
        if: inputs.beta
        shell: bash
        run: |
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          IFS=. read -r a b c <<< "$V"
          B="$a.$b.$((c + 1))-beta.${{ github.run_number }}"
          node -e "const f='app/src-tauri/tauri.conf.json', c=JSON.parse(require('fs').readFileSync(f));
            c.version='$B'; require('fs').writeFileSync(f, JSON.stringify(c, null, 2))"
          sed -i.bak "s/^__version__ = .*/__version__ = \"$B\"/" hpc_hub/__init__.py && rm hpc_hub/__init__.py.bak
          echo "Beta $B"

      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          bash .github/apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev patchelf file

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-backend.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/vpn-helper

      # the window shell's own tests (the window fits the screen, PTYs, sign-in pages); Linux has every library
      - name: Window shell tests
        if: runner.os == 'Linux'
        working-directory: app/src-tauri
        run: cargo test --locked --lib

      # The frozen backend changes only with the Python: a test build reuses the last one made from the same files.
      # A release always makes its own.
      - name: Frozen backend from an earlier build
        id: backend
        if: ${{ !inputs.publish }}
        uses: actions/cache@v6
        with:
          path: app/src-tauri/binaries
          key: backend-${{ runner.os }}-${{ hashFiles('hpc_hub/**', 'bin/**', 'packaging/backend*',
            'packaging/build_backend.py', 'packaging/requirements-backend.txt') }}
      - name: Frozen backend
        if: steps.backend.outputs.cache-hit != 'true'
        run: |
          pip install -r packaging/requirements-backend.txt
          python packaging/build_backend.py
      - name: Frozen backend answers
        timeout-minutes: 2
        shell: bash
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"app.version"}' |
            app/src-tauri/binaries/hpc-hub-backend-* | grep '"version"'
      - name: Frozen backend has the SSH bridge (the asyncssh login's local ssh commands)
        timeout-minutes: 2
        shell: bash
        run: |
          # no arguments: prints its usage and exits 2
          { app/src-tauri/binaries/hpc-hub-backend-* --ssh-bridge 2>&1 || true; } | grep usage

      # VPN on Windows and macOS (docs/design/vpn-helper.md): openconnect and the helper go into
      # app/src-tauri/vpn/, which tauri.windows.conf.json / tauri.macos.conf.json ship as <resources>/vpn/.
      # openconnect is kept in the cache until its scripts change, which saves most of these minutes.
      - name: openconnect from an earlier build
        id: openconnect
        if: runner.os != 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: app/src-tauri/vpn/openconnect
          key: openconnect-${{ runner.os }}-${{ hashFiles('packaging/fetch_openconnect_*.sh', 'packaging/vpn/*') }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && steps.openconnect.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
      - name: openconnect (Windows; MSYS2 has no package, so this builds it)
        if: runner.os == 'Windows' && steps.openconnect.outputs.cache-hit != 'true'
        timeout-minutes: 15
        shell: msys2 {0}
        run: bash packaging/fetch_openconnect_windows.sh
      - name: openconnect (macOS, Homebrew's)
        if: runner.os == 'macOS' && steps.openconnect.outputs.cache-hit != 'true'
        timeout-minutes: 8  # dylibbundler waits for an answer if it can't find a library
        run: bash packaging/fetch_openconnect_macos.sh
      - name: Keep openconnect for the next build
        if: runner.os != 'Linux' && steps.openconnect.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/src-tauri/vpn/openconnect
          key: ${{ steps.openconnect.outputs.cache-primary-key }}
      - name: VPN helper
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --release --manifest-path app/vpn-helper/Cargo.toml
          exe=""; if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          mkdir -p app/src-tauri/vpn
          cp "app/vpn-helper/target/release/hpc-hub-vpn-helper$exe" app/src-tauri/vpn/
          # the VPN without administrator (hpc_hub/connect/vpn_local.py) too
          cp "app/vpn-helper/target/release/hpc-hub-vpn-tunnel$exe" app/src-tauri/vpn/
      - name: Bundled openconnect and VPN helper start
        if: runner.os != 'Linux'
        timeout-minutes: 2
        shell: bash
        run: |
          cd app/src-tauri/vpn
          if [ "$RUNNER_OS" = Windows ]; then
            # only Windows' own folders on PATH, so a DLL left out of the bundle can't load from elsewhere
            PATH=/c/Windows/System32:/c/Windows openconnect/openconnect.exe --version
            ./hpc-hub-vpn-helper.exe --version
            ./hpc-hub-vpn-tunnel.exe --version
          else
            openconnect/openconnect --version
            ./hpc-hub-vpn-helper --version
            ./hpc-hub-vpn-tunnel --version
          fi

      # The VPN without administrator, end to end: the shipped openconnect (patched on Windows) signs in to a
      # make-believe VPN server and hands its tunnel to hpc-hub-vpn-tunnel (tests/connect/test_vpn_local.py)
      - name: VPN without administrator works
        if: runner.os != 'Linux'
        timeout-minutes: 8
        shell: bash
        run: |
          cargo build --release --manifest-path app/vpn-helper/Cargo.toml --example far_side
          pip install -q pytest -r packaging/requirements-backend.txt
          exe=""; if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          HPC_HUB_TEST_OPENCONNECT="$PWD/app/src-tauri/vpn/openconnect/openconnect$exe" \
            python -m pytest -q -p no:cacheprovider tests/connect/test_vpn_local.py -rs

      # The AppImage tools Tauri downloads (linuxdeploy and its GTK and GStreamer plugins), kept between builds
      - name: AppImage tools from an earlier build
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: tauri-tools-${{ runner.os }}-

      - run: npm ci
        working-directory: app
      - name: Sign the Mac app with HPC Hub's own certificate (when it is set)
        if: runner.os == 'macOS' && env.MACOS_SIGN_P12 != ''
        shell: bash
        run: |
          # A keychain of this run's own, in the search list (codesign looks there), with codesign allowed to use
          # the key without asking. macOS doesn't trust a self-made certificate, so it is named by its SHA-1:
          # codesign signs with it anyway, and the signature names it, which is what makes builds the same app.
          kc="$RUNNER_TEMP/hpc-hub-signing.keychain-db"; kpw=$(uuidgen)
          security create-keychain -p "$kpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kpw" "$kc"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$kc" -P "$MACOS_SIGN_P12_PASSWORD" -A -t agg -f pkcs12
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -p codesigning "$kc" | awk '/"HPC Hub Self Signed"/ {print $2; exit}')
          test -n "$id"
          echo "APPLE_SIGNING_IDENTITY=$id" >> "$GITHUB_ENV"

      - name: Make update files too (when the key is set)
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        run: |
          node -e "const f='packaging/tauri.release.json', c=JSON.parse(require('fs').readFileSync(f));
            c.bundle.createUpdaterArtifacts = true; require('fs').writeFileSync(f, JSON.stringify(c, null, 2))"
      # A beta makes only what the updater installs (the MSI and the rpm don't take a version like 0.2.6-beta.12)
      - run: npm run tauri:release -- ${{ inputs.beta && (runner.os == 'Linux' && '--bundles appimage'
          || runner.os == 'Windows' && '--bundles nsis' || '--bundles app') || '' }}
        working-directory: app
      - name: The Mac app is signed with HPC Hub's certificate
        if: runner.os == 'macOS' && env.MACOS_SIGN_P12 != ''
        shell: bash
        run: |
          app=$(ls -d app/src-tauri/target/release/bundle/macos/*.app)
          for bin in "$app/Contents/MacOS/"*; do
            req=$(codesign -dr - "$bin" 2>&1 | tail -1)
            echo "$(basename "$bin"): $req"
            echo "$req" | grep -q 'certificate root = H"'
          done

      - uses: actions/upload-artifact@v7
        with:
          name: hpc-hub-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/*/*.sig

  release:
    # A normal release, not a pre-release: the app asks releases/latest for latest.json, which skips pre-releases.
    # A beta replaces the rolling "beta" pre-release, which only apps with Beta updates on read.
    if: inputs.publish || inputs.beta
    needs: installers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: built
      - name: Release files and latest.json
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "${{ inputs.beta }}" = true ]; then
            IFS=. read -r a b c <<< "$V"; V="$a.$b.$((c + 1))-beta.${{ github.run_number }}"
          fi
          echo "V=$V" >> "$GITHUB_ENV"
          printf '%s\n' "${NOTES:-HPC Hub $V}" > notes.txt
          python3 packaging/release.py built out "$V" notes.txt ${{ inputs.beta && '--beta' || '' }}
          ls -la out
      - name: Publish the beta
        if: inputs.beta
        env:
          GH_TOKEN: ${{ github.token }}
        # updated in place, never deleted first: a refusal halfway used to leave no beta at all
        run: |
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta out/* --prerelease --title "HPC Hub $V (beta)" --notes-file notes.txt \
              --target "$GITHUB_SHA"
            exit 0
          fi
          gh release upload beta out/* --clobber
          for old in $(gh release view beta --json assets -q '.assets[].name'); do
            [ -e "out/$old" ] || case "$old" in quick-fix*) ;; *) gh release delete-asset beta "$old" --yes ;; esac
          done
          gh release edit beta --prerelease --title "HPC Hub $V (beta)" --notes-file notes.txt
          # the tag marks the beta's commit (the Quick fix workflow compares with it). GitHub refuses this token a
          # tag on a commit whose workflow files differ from main's: then it stays where it was, which only makes
          # quick fixes stricter
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/beta" -f sha="$GITHUB_SHA" -F force=true \
            >/dev/null || echo "::warning::The beta tag stays on its old commit"
      - name: Publish
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::error::v$V is released already. Raise the version in app/src-tauri/tauri.conf.json first"
            exit 1
          fi
          gh release create "v$V" out/* --title "HPC Hub $V" --notes-file notes.txt --target "$GITHUB_SHA" --latest
