name: Build

# Only on version tags and by hand: macOS minutes count ten times.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the oldest glibc we build on is the oldest the installers run on
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev patchelf file

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-backend.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Frozen backend
        run: |
          pip install -r packaging/requirements-backend.txt
          python packaging/build_backend.py
      - name: Frozen backend answers
        # Windows: the backend needs Unix sockets and getuid for now (step 10 of docs/design/tauri.md)
        continue-on-error: ${{ runner.os == 'Windows' }}
        timeout-minutes: 2
        shell: bash
        run: echo '{"jsonrpc":"2.0","id":1,"method":"app.version"}' | app/src-tauri/binaries/hpc-hub-backend-* | grep '"version"'

      - run: npm ci
        working-directory: app
      - run: npm run tauri:release
        working-directory: app

      - uses: actions/upload-artifact@v4
        with:
          name: hpc-hub-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
