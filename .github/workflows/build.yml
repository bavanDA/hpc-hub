name: Build

# By hand only, so it never spends minutes by surprise (GitHub Pro: 3000 a month; macOS counts 10x, Windows 2x).
# A full build is about 110 counted minutes; pick fewer systems to spend less.
on:
  workflow_dispatch:
    inputs:
      systems:
        description: 'Runners as JSON, e.g. ["ubuntu-22.04"] for Linux only'
        default: '["ubuntu-22.04","macos-15","windows-latest"]'

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the oldest glibc we build on is the oldest the installers run on
        os: ${{ fromJSON(inputs.systems) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # a stuck macOS job costs at most 300 of the month's minutes
    steps:
      - uses: actions/checkout@v7

      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev patchelf file

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-backend.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/vpn-helper

      - name: Frozen backend
        run: |
          pip install -r packaging/requirements-backend.txt
          python packaging/build_backend.py
      - name: Frozen backend answers
        timeout-minutes: 2
        shell: bash
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"app.version"}' |
            app/src-tauri/binaries/hpc-hub-backend-* | grep '"version"'
      - name: Frozen backend has the SSH bridge (the asyncssh login's local ssh commands)
        timeout-minutes: 2
        shell: bash
        run: |
          # no arguments: prints its usage and exits 2
          { app/src-tauri/binaries/hpc-hub-backend-* --ssh-bridge 2>&1 || true; } | grep usage

      # VPN on Windows and macOS (docs/design/vpn-helper.md): openconnect and the helper go into
      # app/src-tauri/vpn/, which tauri.windows.conf.json / tauri.macos.conf.json ship as <resources>/vpn/.
      # openconnect is kept in the cache until its scripts change, which saves most of these minutes.
      - name: openconnect from an earlier build
        id: openconnect
        if: runner.os != 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: app/src-tauri/vpn/openconnect
          key: openconnect-${{ runner.os }}-${{ hashFiles('packaging/fetch_openconnect_*.sh', 'packaging/vpn/*') }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && steps.openconnect.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
      - name: openconnect (Windows; MSYS2 has no package, so this builds it)
        if: runner.os == 'Windows' && steps.openconnect.outputs.cache-hit != 'true'
        timeout-minutes: 15
        shell: msys2 {0}
        run: bash packaging/fetch_openconnect_windows.sh
      - name: openconnect (macOS, Homebrew's)
        if: runner.os == 'macOS' && steps.openconnect.outputs.cache-hit != 'true'
        timeout-minutes: 8  # dylibbundler waits for an answer if it can't find a library
        run: bash packaging/fetch_openconnect_macos.sh
      - name: Keep openconnect for the next build
        if: runner.os != 'Linux' && steps.openconnect.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/src-tauri/vpn/openconnect
          key: ${{ steps.openconnect.outputs.cache-primary-key }}
      - name: VPN helper
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build --release --manifest-path app/vpn-helper/Cargo.toml
          exe=""; if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          mkdir -p app/src-tauri/vpn
          cp "app/vpn-helper/target/release/hpc-hub-vpn-helper$exe" app/src-tauri/vpn/
      - name: Bundled openconnect and VPN helper start
        if: runner.os != 'Linux'
        timeout-minutes: 2
        shell: bash
        run: |
          cd app/src-tauri/vpn
          if [ "$RUNNER_OS" = Windows ]; then
            # only Windows' own folders on PATH, so a DLL left out of the bundle can't load from elsewhere
            PATH=/c/Windows/System32:/c/Windows openconnect/openconnect.exe --version
            ./hpc-hub-vpn-helper.exe --version
          else
            openconnect/openconnect --version
            ./hpc-hub-vpn-helper --version
          fi

      - run: npm ci
        working-directory: app
      - run: npm run tauri:release
        working-directory: app

      - uses: actions/upload-artifact@v7
        with:
          name: hpc-hub-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
