name: Test

on:
  push:
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
  # Build calls it: a beta or a release publishes only when every system passes (2026-11-24, owner: "release should
  # pass all tests"; quick fixes don't wait for it, to stay quick)
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's when Build calls it: a push never cancels the tests a release waits for
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 35  # room for apt-install.sh to try another mirror
    steps:
      - uses: actions/checkout@v7
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # the packages of the last install that worked (apt-install.sh APT_SAVE): no mirror needed when they still fit;
      # a new key each week, so they follow the runner's image
      - uses: actions/cache@v6
        with:
          path: ~/apt-save
          key: apt-tmux-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: apt-tmux-${{ runner.os }}-
      - run: bash .github/apt-install.sh tmux
        env:
          APT_SAVE: ~/apt-save
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-backend.txt
      - run: pip install pytest ruff -r packaging/requirements-backend.txt
      - run: ruff check hpc_hub tests packaging
      - run: python -m pytest -q

  python-windows:
    # on every push too: the repository is public, so GitHub's Windows runners cost nothing
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-backend.txt
      - run: pip install pytest -r packaging/requirements-backend.txt
      - run: python -m pytest -q -rsx

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # room for apt-install.sh to try another mirror
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npx tsc -b && npm test && npm run build
        working-directory: app
      # all of each package (the cached copy left out glib's pkg-config files, which every build script of the GTK
      # crates asks for); apt-install.sh moves to another mirror when one is slow, and first tries the whole .deb
      # files of the last install that worked (2026-11-24: all three mirrors too slow, twice in a row)
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/apt-save
          key: apt-tauri-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: apt-tauri-${{ runner.os }}-
      - name: Tauri's Linux libraries
        run: bash .github/apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev
        env:
          APT_SAVE: ~/apt-save
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # the window shell's own tests: quick fixes checked at start, terminals start only the backend's ssh, ...
      - run: cargo test --locked --lib
        working-directory: app/src-tauri

  # 2026-11-24, owner: "I fix a bug in fedora, and then I see I got same error in mac". The same tests on macOS and on
  # Fedora (newer Python, OpenSSL and glib than Ubuntu's)
  python-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # GNU tools for the stand-in cluster, as every Linux cluster has them (tests/conftest.py puts them first in
      # PATH only for the tests that need them; the others see macOS's own)
      - run: brew install tmux coreutils findutils gnu-sed grep gnu-tar util-linux rsync
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-backend.txt
      - run: pip install pytest -r packaging/requirements-backend.txt
      - run: python -m pytest -q -rsx

  python-fedora:
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
      # an init that reaps: a stopped background job (a scan on the node) must not stay a zombie, as on a real system
      options: --init
    timeout-minutes: 20
    steps:
      # the container is a bare Fedora: rsync and hostname are on every cluster and desktop, so the stand-in needs them
      - run: dnf install -y -q git python3 python3-pip tmux bash openssh-clients procps-ng which findutils diffutils rsync hostname util-linux
      - uses: actions/checkout@v7
      # as a user, not the container's root: the app never runs as root (the lock's setup refuses root, root writes
      # read-only files)
      - run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
      - run: |
          runuser -u tester -- python3 -m venv /tmp/venv
          runuser -u tester -- /tmp/venv/bin/pip install -q pytest -r packaging/requirements-backend.txt
      - run: runuser -u tester -- /tmp/venv/bin/python -m pytest -q -rsx -p no:cacheprovider

  # the window shell and the VPN helper on the systems they ship on: their Windows and macOS code is only compiled
  # there (the helper ships only on Windows and macOS)
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npm run build  # the shell embeds the built screens
        working-directory: app
      # tauri.windows.conf.json / tauri.macos.conf.json ship app/src-tauri/vpn/ (Build fills it with openconnect and
      # the helper); the build script only needs it there
      - run: mkdir -p app/src-tauri/vpn
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/vpn-helper
      - run: cargo test --locked --lib
        working-directory: app/src-tauri
      - run: cargo test --locked
        working-directory: app/vpn-helper

  # the phone app shares the desktop's screens (@shared): a change there must not break it unseen
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            mobile/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm ci && npx tsc -b
        working-directory: mobile
