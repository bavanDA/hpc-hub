[package]
name = "hpc-hub"
version = "0.2.2"
description = "HPC Hub: work on your HPC clusters"
authors = ["HPC Hub contributors"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hpc_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5" }
portable-pty = "0.9.0"
base64 = "0.23.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
