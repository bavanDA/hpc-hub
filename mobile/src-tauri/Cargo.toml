[package]
name = "hpc-hub-mobile"
version = "0.2.1"
description = "HPC Hub for Android"
authors = ["HPC Hub contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "hpc_hub_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-notification = "=2.7.0"  # same as the npm package, or tauri build refuses
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
