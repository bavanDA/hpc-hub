<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>E: Monochrome rows</title>
<script src="common.js"></script>
<link rel="stylesheet" href="common.css">
<style>
:root { --bg:#ffffff; --fg:#0a0a0a; --sec:#6b6b6b; --line:#e6e6e6; --soft:#f4f4f4; --bd:#d4d4d4;
  --acc:#0a0a0a; --on-acc:#ffffff; }
[data-theme=dark] { --bg:#0b0b0b; --fg:#f2f2f2; --sec:#8f8f8f; --line:#232323; --soft:#171717; --bd:#333;
  --acc:#f2f2f2; --on-acc:#0b0b0b; }
body { font-family:"Inter", system-ui, sans-serif; }
.bar { height:56px; flex:none; display:flex; align-items:center; gap:2px; padding:0 4px; }
.ib { width:48px; height:48px; display:grid; place-items:center; }
.bar h1 { font-size:17px; font-weight:600; flex:1; }
.content { padding:8px 0 0; }
.seg { margin:0 16px 20px; display:flex; height:48px; border:1px solid var(--bd); border-radius:10px; padding:3px; gap:3px; }
.seg button { flex:1; border-radius:7px; font-size:14px; font-weight:500; color:var(--sec); }
.seg button.on { background:var(--acc); color:var(--on-acc); font-weight:600; }
.sec { font-size:12px; font-weight:600; color:var(--sec); letter-spacing:.4px; text-transform:uppercase; padding:0 16px 6px; }
.list { border-top:1px solid var(--line); }
.row { min-height:56px; display:flex; align-items:center; padding:0 16px; border-bottom:1px solid var(--line); gap:10px; font-size:16px; }
.row .l { flex:1; }
.row .v { font-size:16px; font-weight:500; font-variant-numeric:tabular-nums; }
.row .v small { font-size:14px; color:var(--sec); font-weight:400; }
.row .chev { width:18px; height:18px; color:var(--sec); stroke-width:2; }
.row.ed { flex-direction:column; align-items:stretch; padding:12px 16px 14px; gap:8px; background:var(--soft); }
.row.ed .top { display:flex; justify-content:space-between; font-size:14px; color:var(--sec); }
.inp { height:52px; border:1.5px solid var(--acc); border-radius:8px; display:flex; align-items:center; padding:0 14px; font-size:22px; font-weight:600; background:var(--bg); }
.inp small { margin-left:auto; font-size:15px; font-weight:400; color:var(--sec); }
.foot { padding:12px 16px; flex:none; }
.cta { width:100%; height:52px; border-radius:10px; background:var(--acc); color:var(--on-acc); font-size:16px; font-weight:600; }
</style>
</head>
<body data-kb="android">
<div class="sb"></div>
<div class="bar">
  <button class="ib" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <h1>Get a node on Wulver</h1>
</div>
<div class="grow"><div class="content">
  <div class="seg"><button data-on="default">Small</button><button>Medium</button><button data-on="gpu">GPU 10 GB</button></div>
  <div class="list">
    <div class="row" data-show="default gpu"><span class="l">Cores</span><span class="v"><span data-show="default">2</span><span data-show="gpu">4</span></span></div>
    <div class="row ed" data-show="edit">
      <div class="top"><span>Cores</span><span>Up to 128 cores</span></div>
      <div class="inp">6<i class="caret"></i><small>cores</small></div>
    </div>
    <div class="row"><span class="l">Memory</span><span class="v"><span data-show="default edit">8</span><span data-show="gpu">16</span> <small>GB</small></span></div>
    <div class="row"><span class="l">GPU</span><span class="v"><span data-show="default edit">No GPU</span><span data-show="gpu">A100 10 GB slice</span></span><svg class="i chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></div>
    <div class="row"><span class="l">Time</span><span class="v">4 <small>h</small> 0 <small>min</small></span></div>
  </div>
</div></div>
<div class="foot"><button class="cta">Get node</button></div>
<div class="gb"></div>
</body>
</html>
